[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kustomcraft-engine"
version = "0.1.0"
description = "Plataforma de automação gráfica, pré-impressão e gestão de pedidos para Studio Kustom"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Studio Kustom", email = "contato@studiokustom.com.br" }
]
dependencies = [
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "reportlab>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
